# Recipe: Qwen/Qwen3.8-27B-FP8 (dense 27B, Qwen3.5 hybrid GDN arch, native VLM, MTP head)
# Source of truth: spark-1 ~/llm/qwen3.8-27b-fp8.yaml (deploy script copies it to
# spark-2:~/spark-vllm-docker-aug/recipes/). Needs the Aug-2026 image
# (vllm-node-aug: vLLM main nightly + transformers>=5.8) — Qwen3.8 does NOT load
# on the Apr-2026 vllm-node image (transformers 4.57).
recipe_version: "1"
name: Qwen38-27B-FP8
description: vLLM serving Qwen3.8-27B-FP8 (solo, spark-2)

model: Qwen/Qwen3.8-27B-FP8

container: vllm-node-aug

# No chat-template mod: the Qwen3.8 repo template carries enable_thinking /
# preserve_thinking / reasoning_effort and must be used as shipped.
mods: []

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.60
  max_model_len: 262144
  max_num_batched_tokens: 65536

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: 1

# bf16 KV on purpose (NOT --kv-cache-dtype fp8): FP8 KV silently corrupted
# output on Qwen3.5-122B (DeltaNet) on this box, and we now have KV headroom.
# MTP ("mtp", 3 tokens) = the model's own draft head; remove the
# --speculative-config line when running the KV_NVME experiment (open vLLM
# bugs: offload + spec decode stores but never serves, #52735/#41515).
command: |
  vllm serve Qwen/Qwen3.8-27B-FP8 \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --load-format fastsafetensors \
    --attention-backend flashinfer \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --async-scheduling \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3}' \
    -tp {tensor_parallel}
